# config/settings.yaml  (v2)
# ============================================================
# AWR Insight Portal — Master Configuration
# All paths support both Windows (C:/...) and Linux (/mnt/...)
# ============================================================

# ── Database connection ───────────────────────────────────────────────
database:
  dbname:   "postgres"
  user:     "postgres"
  password: "Admin123"
  host:     "localhost"
  port:     5432

# ── Logging ───────────────────────────────────────────────────────────
logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  dir:   "logs"          # Relative to project root

# ── Source mode ───────────────────────────────────────────────────────
source:
  mode: "local"          # local | central | both | direct_db
  local_watch_dir: "awr_reports"
  central_repo_path: "/mnt/shared/oracle_awrs"
  repo_scan_interval_seconds: 300
  repo_recursive: true
  repo_db_filter: []
  oracle_connect:
    enabled: false
    connections: []

# ── SAR reports ───────────────────────────────────────────────────────
sar:
  input_dir:    "sar_reports"     # Root for SAR text files
  timezone:     "Asia/Kolkata"    # TZ for WSL binary conversion
  # Layout: sar_reports/<HOSTNAME>/sar<date>.txt
  # For binary SAR files, pre-convert with: sar -A -f /var/log/sa/saNN > sar_text.txt

# ── File watcher ──────────────────────────────────────────────────────
watcher:
  poll_interval_seconds: 10
  awr_extensions:
    - ".html"
    - ".htm"
    - ".txt"

# ── Queue processor ───────────────────────────────────────────────────
queue:
  max_retries:               3
  poll_interval_seconds:    15
  archive_on_success:       true
  sar_poll_interval_seconds: 15

# ── Paths (output / work directories) ─────────────────────────────────
paths:
  watch_directory:        "awr_reports"
  queues_directory:       "queues"
  archive_directory:      "archive"
  master_parser:          "master_parser.py"
  sar_drop_directory:     "sar_drop"
  sar_queues_directory:   "sar_queues"
  sar_archive_directory:  "sar_archive"
  nmon_drop_directory:    "nmon_drop"
  nmon_queues_directory:  "nmon_queues"
  nmon_archive_directory: "nmon_archive"
  nmon_cache_directory:   "nmon_cache"   # SSH-pulled NMON files — NOT watched by NMONWatcher

# ── Database type detection ───────────────────────────────────────────
db_detection:
  mode: "auto"
  db_overrides: []

# ── AI / Recommendation engine ────────────────────────────────────────
ai:
  mode: "rules"           # rules | local | cloud
  ollama:
    enabled:  false
    base_url: "http://localhost:11434"
    model:    "llama3"
    timeout:  60
  anthropic:
    enabled:  false
    api_key:  ""
    model:    "claude-sonnet-4-6"
    max_tokens: 1024
  rules:
    rules_file: "rules/recommendation_rules_v2.json"
    min_severity_to_show: "medium"

# ── Grafana ───────────────────────────────────────────────────────────
grafana:
  base_url:       "http://localhost:3000"
  api_key:        ""
  org_id:         1
  datasource:     "AWR_Parser_PG"
  # Admin credentials — used by auto-patch to re-import dashboards
  # into Grafana internal DB after IP change. Match your Grafana admin account.
  admin_user:     "admin"
  admin_password: "admin@123"
  # Dashboard JSON folder — project dashboard/ dir, NOT Grafana install path.
  # bulk_import.py reads from here; patch_grafana_urls.py patches here.
  dashboard_dir:  "dashboard"

# ── Alerting ──────────────────────────────────────────────────────────
alerting:
  enabled: false
  webhook_url: ""
  email:
    enabled:   false
    smtp_host: "localhost"
    smtp_port: 25
    from:      "awrparser@company.com"
    to:        []


portal:
  awr_archive_retain_days:  7   # set to 7 for minimal, 90 for longer history
  sar_archive_retain_days:  7
  nmon_archive_retain_days: 7

# ── Live Oracle query engine (PL/SQL Performance Analysis, System Study,
#    and any future live-Oracle feature that goes through
#    modules/oracle_live_query.py) ──────────────────────────────────────
oracle_live_query:
  # Hard timeout in milliseconds. If a query doesn't return within this
  # window, oracledb actively interrupts the in-progress server-side
  # call (not just a client-side give-up) so it stops consuming
  # resources on the customer's database. Default 5000ms per Ganesh's
  # requirement -- queries are designed to complete within 2000ms
  # under normal conditions; this timeout is the safety net for
  # abnormal cases (large ASH history window, unusually busy system),
  # not the expected/target runtime.
  query_timeout_ms: 5000

# ── Analysis Report AI narrative (local_ai mode / Ollama) ───────────────────
# Was hardcoded (timeout=120, num_predict=600) until 2026-09-03 -- moved here
# so it can be tuned without a code change. Defaults below match what was
# already hardcoded, so nothing changes until you edit this.
ai_narrative:
  # Max seconds to wait for Ollama to return the narrative before giving
  # up. Already raised once before (45s -> 120s, see the comment this
  # replaced in analysis_report_generator.py) for CPU-bound Ollama
  # inference with no GPU. If you're still hitting timeouts, raise this
  # first -- it's the direct fix. A slow/unreachable AI endpoint can't
  # hang report generation past this value; the report still completes,
  # just without the AI panel (falls back to Rules-mode findings only).
  ollama_timeout_seconds: 120
  # Max tokens Ollama is asked to generate for the narrative. Lowering
  # this (e.g. to 400) directly reduces generation time on CPU-bound
  # inference, since output length is the main driver of total time --
  # trade narrative length/detail for speed if raising the timeout
  # alone doesn't get you where you want. Raising it does the opposite.
  ollama_num_predict: 600
  # How long Ollama keeps this model loaded in memory after a request,
  # so the NEXT report generation doesn't pay the cost of reloading an
  # 8B model from disk (which can itself take 30-60+ seconds on
  # CPU-only hardware, on top of actual generation time -- often the
  # real cause of a timeout that a warm-inference baseline shouldn't
  # hit). Accepts Ollama's normal keep_alive formats: a duration string
  # ("30m", "1h"), a number of seconds, or -1 to never unload. This
  # value is sent with every request and overrides Ollama's own
  # server-level OLLAMA_KEEP_ALIVE setting (per Ollama's docs), so it
  # works regardless of how Ollama is hosted on your server.
  ollama_keep_alive: "30m"

# ── Anomaly detection thresholds ─────────────────────────────────────────────
# AWR thresholds (also serve as fallback for SAR/NMON if their sections are absent)
anomaly:
  z_threshold:   1.5
  baseline_days: 90
  min_samples:   3

# SAR-specific thresholds (Linux) — override anomaly: values above if set
anomaly_sar:
  z_threshold:   1.5
  baseline_days: 90
  min_samples:   3

# NMON-specific thresholds (IBM AIX) — AIX CPU/disk metrics can differ significantly
# from Linux SAR counters; tune independently when a client has both environments
anomaly_nmon:
  z_threshold:   1.5   # raise to 2.0 if AIX base load is more variable
  baseline_days: 90
  min_samples:   3