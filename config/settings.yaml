# config/settings.yaml  (v2)
# ============================================================
# AWR Insight Portal — Master Configuration
# All paths support both Windows (C:/...) and Linux (/mnt/...)
# ============================================================

# ── Database connection ───────────────────────────────────────────────
database:
  dbname:   "postgres"
  user:     "postgres"
  password: "Admin123"
  host:     "localhost"
  port:     5432

# ── Logging ───────────────────────────────────────────────────────────
logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  dir:   "logs"          # Relative to project root

# ── Source mode ───────────────────────────────────────────────────────
source:
  mode: "local"          # local | central | both | direct_db
  local_watch_dir: "awr_reports"
  central_repo_path: "/mnt/shared/oracle_awrs"
  repo_scan_interval_seconds: 300
  repo_recursive: true
  repo_db_filter: []
  oracle_connect:
    enabled: false
    connections: []

# ── SAR reports ───────────────────────────────────────────────────────
sar:
  input_dir:    "sar_reports"     # Root for SAR text files
  timezone:     "Asia/Kolkata"    # TZ for WSL binary conversion
  # Layout: sar_reports/<HOSTNAME>/sar<date>.txt
  # For binary SAR files, pre-convert with: sar -A -f /var/log/sa/saNN > sar_text.txt

# ── File watcher ──────────────────────────────────────────────────────
watcher:
  poll_interval_seconds: 10
  awr_extensions:
    - ".html"
    - ".htm"
    - ".txt"

# ── Queue processor ───────────────────────────────────────────────────
queue:
  max_retries:               3
  poll_interval_seconds:    15
  archive_on_success:       true
  sar_poll_interval_seconds: 15

# ── Paths (output / work directories) ─────────────────────────────────
paths:
  watch_directory:        "awr_reports"
  queues_directory:       "queues"
  archive_directory:      "archive"
  master_parser:          "master_parser.py"
  sar_drop_directory:     "sar_drop"
  sar_queues_directory:   "sar_queues"
  sar_archive_directory:  "sar_archive"
  nmon_drop_directory:    "nmon_drop"
  nmon_queues_directory:  "nmon_queues"
  nmon_archive_directory: "nmon_archive"
  nmon_cache_directory:   "nmon_cache"   # SSH-pulled NMON files — NOT watched by NMONWatcher

# ── Database type detection ───────────────────────────────────────────
db_detection:
  mode: "auto"
  db_overrides: []

# ── AI / Recommendation engine ────────────────────────────────────────
ai:
  mode: "rules"           # rules | local | cloud
  ollama:
    enabled:  false
    base_url: "http://localhost:11434"
    model:    "llama3"
    timeout:  60
  anthropic:
    enabled:  false
    api_key:  ""
    model:    "claude-sonnet-4-6"
    max_tokens: 1024
  rules:
    rules_file: "rules/recommendation_rules_v2.json"
    min_severity_to_show: "medium"

# ── Grafana ───────────────────────────────────────────────────────────
grafana:
  base_url:       "http://localhost:3000"
  api_key:        ""
  org_id:         1
  datasource:     "AWR_Parser_PG"
  # Admin credentials — used by auto-patch to re-import dashboards
  # into Grafana internal DB after IP change. Match your Grafana admin account.
  admin_user:     "admin"
  admin_password: "admin@123"
  # Dashboard JSON folder — project dashboard/ dir, NOT Grafana install path.
  # bulk_import.py reads from here; patch_grafana_urls.py patches here.
  dashboard_dir:  "dashboard"

# ── Alerting ──────────────────────────────────────────────────────────
alerting:
  enabled: false
  webhook_url: ""
  email:
    enabled:   false
    smtp_host: "localhost"
    smtp_port: 25
    from:      "awrparser@company.com"
    to:        []


portal:
  awr_archive_retain_days:  7   # set to 7 for minimal, 90 for longer history
  sar_archive_retain_days:  7
  nmon_archive_retain_days: 7

# ── Anomaly detection thresholds ─────────────────────────────────────────────
# AWR thresholds (also serve as fallback for SAR/NMON if their sections are absent)
anomaly:
  z_threshold:   1.5
  baseline_days: 90
  min_samples:   3

# SAR-specific thresholds (Linux) — override anomaly: values above if set
anomaly_sar:
  z_threshold:   1.5
  baseline_days: 90
  min_samples:   3

# NMON-specific thresholds (IBM AIX) — AIX CPU/disk metrics can differ significantly
# from Linux SAR counters; tune independently when a client has both environments
anomaly_nmon:
  z_threshold:   1.5   # raise to 2.0 if AIX base load is more variable
  baseline_days: 90
  min_samples:   3